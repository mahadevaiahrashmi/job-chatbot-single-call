[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-chatbot-single-call"
version = "0.1.0"
description = "Single-call job-search chatbot (one Claude call, four tools)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Rashmi Mahadevaiah" }]
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
job-chatbot-single-call = "job_chatbot_single_call.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_chatbot_single_call"]
